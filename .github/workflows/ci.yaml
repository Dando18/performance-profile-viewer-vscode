on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  release:
    types: [created]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        hatchet-version: ['1.4.1']
        vscode-version: ['1.84.2']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Node.js Dependencies
        run: npm install
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Python Dependencies
        run: pip install hatchet==${{ matrix.hatchet-version }}
      - name: Run Linux Tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- ${{ matrix.vscode-version }}
      - name: Run Tests
        if: runner.os != 'Linux'
        run: npm test -- ${{ matrix.vscode-version }}

  test-stable:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        hatchet-version: ['1.4.1']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Node.js Dependencies
        run: npm install
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Python Dependencies
        run: pip install hatchet==${{ matrix.hatchet-version }}
      - name: Run Linux Tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- stable
      - name: Run Tests
        if: runner.os != 'Linux'
        run: npm test -- stable

  are_stable_tests_passing:
    needs: [test-stable]
    runs-on: ubuntu-latest
    steps:
      - name: Check Stable Tests
        run: echo "Stable tests are passing"

  are_all_tests_passing:
    needs: [test, test-stable]
    runs-on: ubuntu-latest
    steps:
      - name: Check Tests
        run: echo "All tests are passing"

  coverage:
    runs-on: ubuntu-latest
    needs: are_stable_tests_passing
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Node.js Dependencies
        run: npm install
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          cache: 'pip'
      - name: Install Python Dependencies
        run: pip install hatchet
      - name: Coverage
        run: xvfb-run -a npm run coverage
      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Node.js Dependencies
        run: npm install
      - name: Check Format
        run: npm run check-format

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: are_all_tests_passing
    if: success() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Node.js Dependencies
        run: npm install
      - name: Package
        run: npm run package
      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          fail_on_unmatched_files: true
      - name: Deploy
        run: npm run deploy
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
